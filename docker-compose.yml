version: '3.8'
services:
  web:
    build: .
    working_dir: /app
    command: gunicorn zcamp.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - .:/app:delegated
    depends_on:
      - static

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/usr/share/nginx/html:ro
    depends_on:
      - web

  static:
    build: .
    working_dir: /app
    command: python manage.py collectstatic --noinput
    env_file: .env
    volumes:
      - static_volume:/usr/share/nginx/html

volumes:
  static_volume:
    driver: local
